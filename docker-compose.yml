services:

  web:
    build: .
    container_name: box_selection_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: box_selection_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: box_selection_db
    environment:
      POSTGRES_DB: box_selection_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: box_selection_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: